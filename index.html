<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Wellspring Pharmacy Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Libre+Caslon+Text:wght@400;700&family=Caveat:wght@500&display=swap">
<style>
/* Layout: product-accurate pharmacy workspace (header, pill nav, main) with a separate dark "Demo guide" rail that sits outside the product */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --ink:#13244a; --ink2:#44557a; --muted:#7a879e; --line:#dfe5ef; --line2:#eef2f8;
  --blue:#2356d8; --blue-soft:#e9effd; --amber:#a96300; --amber-soft:#fff2d9; --green:#18794e; --green-soft:#e2f4ea;
  --red:#b93228; --red-soft:#fdeceb; --violet:#6141b8; --violet-soft:#efe9fc; --brand:#1d5a62; --brand-soft:#e5f0f0;
  --guide:#0f1c3a; --guide-2:#1a2a52; --guide-fg:#e6ecf8; --guide-mut:#9fb0d2; --gold:#f2c14e;
  --f-ui:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-brand:"Libre Caslon Text",Georgia,serif;
  --f-sig:"Caveat","Segoe Script","Bradley Hand",cursive;
  --guide-w:340px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}

/* ---------- sign-in ---------- */
.signin{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--bg),#e8eef7)}
.si-card{width:min(980px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px -24px rgba(19,36,74,.35);display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden}
.si-left{padding:40px 40px 36px;display:grid;gap:18px;align-content:start}
.si-right{background:var(--line2);padding:32px;display:grid;align-content:center}
.si-eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.si-left h1{font-family:var(--f-brand);font-size:clamp(30px,4.6vw,42px);font-weight:700;color:var(--brand);line-height:1.08}
.si-left p{margin:0;color:var(--ink2);max-width:46ch}
.si-feats{display:grid;gap:12px;margin-top:6px}
.si-feat{border-left:3px solid var(--brand);padding-left:12px}
.si-feat b{display:block;font-size:13px}
.si-feat span{font-size:13px;color:var(--ink2)}
.si-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:14px}
.si-box h2{font-size:20px}
.persona{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.persona small{display:block;color:var(--muted);font-size:12px}
.demo-note{font-size:12px;color:var(--muted)}
.powered{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-content:center}
.ws-word{font-weight:800;color:var(--blue);letter-spacing:-.01em}

/* ---------- app shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.demo-ribbon{background:var(--guide);color:var(--guide-fg);font-size:12px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo-ribbon b{color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.shell{display:flex;flex:1;min-height:0}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-family:var(--f-brand);font-weight:700;color:var(--brand);font-size:17px;line-height:1.1}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 5px}
.user-chip .avatar{width:28px;height:28px;font-size:12px}
.user-chip small{display:block;font-size:11px;color:var(--muted)}
.user-chip b{font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 12px;border-radius:8px 8px 0 0;font-weight:500;color:var(--ink2);white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink);background:var(--line2)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.count{font-size:11px;font-weight:700;background:var(--blue);color:#fff;border-radius:10px;padding:1px 6px;line-height:16px}
.count.grey{background:var(--line);color:var(--ink2)}
main{padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1320px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.page-h p{margin:4px 0 0;color:var(--ink2)}
.page-h .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#c5cfe0;background:#fafbfe}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1c49bd}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn.demo{background:var(--guide);border-color:var(--guide);color:var(--gold)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--blue);font-weight:600}
.link:hover{text-decoration:underline}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface)}
textarea.input{resize:vertical;min-height:70px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:34px}
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;line-height:18px}
.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-green{background:var(--green-soft);color:var(--green)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-violet{background:var(--violet-soft);color:var(--violet)}
.c-grey{background:var(--line2);color:var(--ink2)}
.c-brand{background:var(--brand-soft);color:var(--brand)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h p{margin:0;font-size:12px;color:var(--muted)}
.panel-h .r{margin-left:auto}
.panel-b{padding:16px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;gap:4px;border-top:3px solid var(--k,var(--line))}
.kpi:hover{border-color:#c5cfe0}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi .t{font-size:12px;font-weight:600;color:var(--ink2)}
.kpi .s{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line2)}
.alert:last-child{border-bottom:0}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px}
.alert b{display:block;font-size:13px}
.alert span{font-size:12px;color:var(--ink2)}
.alert .go{margin-left:auto;align-self:center}
.feed{display:grid}
.feed-i{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:13px}
.feed-i:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--blue)}
.feed-i small{display:block;color:var(--muted);font-size:11px}
.money{font-size:30px;font-weight:800;letter-spacing:-.02em}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;border-top:3px solid var(--k);min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.col-h h3{font-size:14px;font-weight:700}
.col-h .count{margin-left:auto;background:var(--line2);color:var(--ink2)}
.col-sub{font-size:11px;color:var(--muted);padding:0 12px 8px}
.cards{display:grid;gap:8px;padding:0 8px 8px}
.card{display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;background:var(--surface);position:relative}
.card:hover{border-color:#b9c6dd;box-shadow:0 2px 8px -4px rgba(19,36,74,.25)}
.card .row1{display:flex;align-items:center;gap:6px}
.card .pt{font-weight:700;font-size:13px}
.card .row1 .chip{margin-left:auto}
.card .med{font-size:12px;color:var(--ink)}
.card .sub{font-size:11px;color:var(--ink2)}
.card .prac{font-size:11px;font-weight:700;color:var(--ink)}
.card .oid{font-size:11px;font-weight:700;color:var(--blue)}
.card .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.card.locked{background:#fbfaff;border-style:dashed}
.empty{padding:16px 12px;font-size:12px;color:var(--muted);text-align:center}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafe}
td small{display:block;color:var(--muted);font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(15,28,58,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(15,28,58,.4)}
.drawer-h{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 18px;padding-top:max(16px,env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:flex-start}
.drawer-h h2{font-size:20px;font-weight:800}
.drawer-h .meta{font-size:12px;color:var(--ink2);margin-top:3px}
.x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);flex:none}
.x:hover{background:var(--line2)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px 40px;padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.actbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.actbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 12px;font-size:13px}
.banner b{display:block}
.b-violet{background:var(--violet-soft);color:#3d2a7a}
.b-red{background:var(--red-soft);color:#7d2019}
.b-amber{background:var(--amber-soft);color:#6d4100}
.b-green{background:var(--green-soft);color:#0e5034}
.b-blue{background:var(--blue-soft);color:#1a3f9c}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.sec-h h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.sec-h .r{margin-left:auto}
.sec-b{padding:12px 14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kv .v{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}
@media (max-width:480px){.kv{grid-template-columns:1fr}}
.checks{display:grid;gap:0}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.chk:last-child{border-bottom:0}
.chk .i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.i-ok{background:var(--green-soft);color:var(--green)}
.i-warn{background:var(--amber-soft);color:var(--amber)}
.i-info{background:var(--blue-soft);color:var(--blue)}
.i-block{background:var(--red-soft);color:var(--red)}
.chk small{display:block;color:var(--muted);font-size:12px}
.timeline{display:grid}
.ev{display:grid;grid-template-columns:14px 1fr;gap:10px;position:relative;padding-bottom:12px}
.ev:before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.ev:last-child:before{display:none}
.ev .d{width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);background:var(--muted);box-shadow:0 0 0 1px var(--line);margin-top:2px;z-index:1}
.ev .d.you{background:var(--brand)}
.ev .d.pay{background:var(--green)}
.ev .d.ws{background:var(--blue)}
.ev b{font-size:13px;font-weight:600}
.ev small{display:block;color:var(--muted);font-size:11px}
.msgs{display:grid;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;background:var(--line2)}
.msg.me{justify-self:end;background:var(--brand);color:#fff}
.msg small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer .input{flex:1}

/* modal */
.modal{position:fixed;inset:0;z-index:51;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .scrim{z-index:0;position:absolute}
.mbox{position:relative;z-index:1;background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:0 30px 60px -20px rgba(15,28,58,.5)}
.mbox.wide{width:min(820px,100%)}
.mbox-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.mbox-h h2{font-size:19px;font-weight:800}
.mbox-h p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.mbox-b{padding:4px 20px 18px;display:grid;gap:14px}
.mbox-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* prescription document */
.rxdoc{background:#fff;border:1px solid #cfd6e2;font-family:var(--f-ui);color:#111;font-size:11.5px;padding:18px 20px;display:grid;gap:10px}
.rx-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px}
.rx-top h4{font-size:13px;letter-spacing:.06em}
.rx-top .r{text-align:right;font-size:11px}
.rx-box{border:1px solid #9aa3b2}
.rx-box .t{background:#eef1f6;font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid #9aa3b2}
.rx-box .c{padding:7px 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.rx-box .c.one{grid-template-columns:1fr}
.rx-box .c div{min-width:0}
.rx-box .c i{font-style:normal;color:#555;font-size:10px;display:block;text-transform:uppercase;letter-spacing:.04em}
.sigline{font-family:var(--f-sig);font-size:26px;color:#1a3f9c;line-height:1}
.rx-foot{display:flex;justify-content:space-between;font-size:10px;color:#666}
.watermark{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase}

/* misc */
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12px;color:var(--ink2)}
.subtab.on{background:var(--blue-soft);border-color:#c8d6fb;color:var(--blue)}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st{height:6px;border-radius:3px;background:var(--line)}
.st.on{background:var(--green)}
.st.cur{background:var(--amber)}
.howbill{display:grid;gap:12px}
.howbill div{display:grid;grid-template-columns:26px 1fr;gap:10px}
.howbill .n{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:800;display:grid;place-items:center;font-size:12px}
.howbill b{display:block;font-size:13px}
.howbill span{font-size:12px;color:var(--ink2)}
.price-edit{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.price-edit .input{width:90px;padding:6px 8px;text-align:right}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.mini-portal{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mp-top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mp-row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12px}
.mp-row:last-child{border-bottom:0}

/* workbench shell (matches the live Pharmacy Workbench) */

function wsId(t,n){const d=new Date(t);const ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;let h=(n*2654435761)>>>0,s="";for(let i=0;i<10;i++){h=(Math.imul(h,1103515245)+12345)>>>0;s+="0123456789ABCDEF"[h>>>28]}return `WS-${ymd}-${s}`}
function fedex(n){let h=(n*40503+7)>>>0,s="";for(let i=0;i<12;i++){h=(Math.imul(h,1664525)+1013904223)>>>0;s+=String((h>>>16)%10)}return `${s.slice(0,4)} ${s.slice(4,8)} ${s.slice(8)}`}
function mk(o){
 const p=PRESCRIBERS.find(x=>x.id===o.presc);
 const n=SEQ++;
 const ord=Object.assign({qty:1,refills:0,days:30,ship:"Patient home",msgs:[],ev:[],clar:null},o);
 ord.id=wsId(ord.created,n);
 ord.prac=p.prac;
 const prac=PRACTICES.find(x=>x.id===p.prac);
 ord.pay=o.pay||(prac.bill==="practice"?"practice":"patient");
 ord.amount=priceFor(prac.cat,ord.item)*ord.qty;
 if(ord.revAt&&!ord.rx) ord.rx="RX-"+(313000+n%900);
 if(ord.readyAt){ord.carrier="FedEx";ord.track=fedex(n)}
 const it=ITEMS.find(i=>i.id===ord.item);
 if(o.days==null&&it.days) ord.days=it.days;
 if(CDIFF[it.id]&&!ord.cdiff) ord.cdiff=CDIFF[it.id];
 const E=(t,txt,k)=>ord.ev.push({t,txt,k:k||""});
 E(ord.created,`Prescription created by ${p.name}, ${p.cred} at ${prac.name}`,"ws");
 if(!it.ctrl) E(ord.created+15e3,`Stored e-signature applied (authorized ${fDate(p.sig)})`,"ws");
 else E(ord.created+15e3,`Manually signed ${it.ctrl} prescription faxed by the practice. Prescriber DEA registration verified`,"ws");
 E(ord.created+20e3,`Compliance checks passed: license, NPI and signature authorization current. 503A: patient-specific${ord.cdiff?", clinical difference documented":""}`,"ws");
 if(ord.pay==="practice"){E(ord.created+30e3,`Billed to practice. Added to the current ${prac.name} statement`,"pay")}
 else{E(ord.created+30e3,`Pharmacy-branded payment request emailed to ${PATIENTS[ord.pt].name}`,"pay");
   if(ord.paidAt) E(ord.paidAt,`Patient paid ${$$(ord.amount)} (Visa ••${ord.card||"4242"})`,"pay");}
 const inQ=ord.pay==="practice"?ord.created+45e3:ord.paidAt;
 if(inQ) E(inQ+15e3,`Prescription faxed to ${PHARM.short} and added to Orders`,"ws");
 if(ord.acceptedAt) E(ord.acceptedAt,`Accepted by ${PHARM.user}`,"you");
 if(ord.revAt) E(ord.revAt,`Rx # ${ord.rx} added · RPh review by ${PHARM.user}`,"you");
 if(ord.readyAt) E(ord.readyAt,`Marked ready to ship. FedEx label created automatically · tracking ${ord.track} shared with ${prac.name}`,"ws");
 if(ord.shippedAt) E(ord.shippedAt,`Picked up by FedEx. Status updated automatically`,"ws");
 if(ord.deliveredAt) E(ord.deliveredAt,`Delivered (FedEx)`,"ws");
 ord.ev.sort((a,b)=>a.t-b.t);
 return ord;
}

function priceFor(catId,itemId){const c=CATALOGS.find(x=>x.id===catId);return c.price[itemId]??ITEMS.find(i=>i.id===itemId).base}

 {const R=RX503[it.id];

function billing(){
 const CYC=at(11,5,0);
 const cyc=S.orders.filter(o=>o.pay==="practice"&&o.created>=CYC&&o.stage!=="unable");
 const seed={cg:{n:14,a:2370},si:{n:9,a:1488},od:{n:6,a:862}};
 const stmts=["cg","si","od"].map(p=>{const os=cyc.filter(o=>o.prac===p);return {id:"EST-"+p,prac:p,orders:seed[p].n+os.length,amount:seed[p].a+os.reduce((a,o)=>a+o.amount,0),live:os,presc:PRESCRIBERS.filter(x=>x.prac===p)}});
 const hist=[{id:"INV-1058",prac:"cg",orders:22,amount:3712,period:"Oct 22–Nov 4",paid:at(11,7,10)},{id:"INV-1059",prac:"si",orders:13,amount:2184,period:"Oct 22–Nov 4",paid:at(11,7,10)},{id:"INV-1060",prac:"od",orders:8,amount:1136,period:"Oct 22–Nov 4",paid:at(11,7,10)},{id:"INV-1055",prac:"cg",orders:19,amount:3240,period:"Oct 8–21",paid:at(10,24,10)},{id:"INV-1056",prac:"si",orders:11,amount:1876,period:"Oct 8–21",paid:at(10,24,10)},{id:"INV-1057",prac:"od",orders:5,amount:710,period:"Oct 8–21",paid:at(10,24,10)}];
 const pp=S.orders.filter(o=>o.pay==="patient"&&o.paidAt).sort((a,b)=>b.paidAt-a.paidAt);
 const ppPending=pp.filter(o=>o.paidAt>now()-2*D),ppDone=pp.filter(o=>o.paidAt<=now()-2*D);
 const card=Math.round(pp.reduce((a,o)=>a+o.amount*0.0035,0)*100)/100;
 const estimate=stmts.reduce((a,s)=>a+s.amount,0)+ppPending.reduce((a,o)=>a+o.amount,0);
 const ytd=61840.25+hist.reduce((a,s)=>a+s.amount,0)+ppDone.reduce((a,o)=>a+o.amount,0)-card;
 return {stmts,hist,pp,ppPending,ppDone,card,estimate,ytd,ytdN:38+hist.length+ppDone.length,cycOrders:stmts.reduce((a,s)=>a+s.orders,0)+ppPending.length};
}

 const ds=document.querySelector(".drawer-b")?.scrollTop||0;
 if(!S.signedIn){root.innerHTML=signin();return}
 const views={orders:vOrders,history:vHistory,patients:vPatients,practices:vPractices,catalogs:vCatalogs,messages:vMessages,billing:vBilling,account:vAccount,learn:vLearn};
 root.innerHTML=`<div class="app"><div class="demo-ribbon"><span><b>Demo</b> &nbsp;Fictitious pharmacy, prescribers and patients. Nothing is sent or charged.</span><span class="tn">Demo time: ${fDate(now())}</span></div>
 <div class="shell">${sidebar()}<div class="main-col">${topstrip()}${mnav()}<main>${views[S.view]()}</main></div>${guide()}</div></div>
 ${S.ui.order?drawer(ord(S.ui.order)):""}${S.ui.modal?modal(S.ui.modal):""}${S.intro?intro():""}`;
 const dr=document.querySelector(".drawer-b");if(dr&&ds)dr.scrollTop=ds;
 if(S.ui.hi){const els=document.querySelectorAll(S.ui.hi);els.forEach(e=>e.classList.add("pulse"));if(els[0])els[0].scrollIntoView({behavior:"smooth",block:"center"});S.ui.hi=null}
}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,id=el.dataset.id;
 if(a==="nav")return A.nav(el.dataset.v);
 if(a==="ptab")return A.ptab(el.dataset.t);
 if(a==="catOpen")return A.catOpen(id||null);
 if(a==="ptFromOrder"){S.ui.order=null;S.ui.modal=null;S.view="patients";return A.patient(id)}
 if(a==="open"&&S.ui.modal){S.ui.modal=null}
 if(A[a])A[a](id??el.dataset.t);
});
document.addEventListener("input",e=>{
 if(e.target.id==="f-cq"){S.ui.cq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("f-cq");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
 if(e.target.id==="f-q"){S.ui.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("f-q");if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener("change",e=>{
 const m={"f-fp":"fp","f-fx":"fx","f-fpay":"fpay"}[e.target.id];if(m){S.ui[m]=e.target.value;render()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.matches&&e.target.matches('.card[role="button"]')){e.preventDefault();e.target.click();return}
 if(e.key==="Escape"){if(S.ui.modal){S.ui.modal=null;render()}else if(S.ui.order){S.ui.order=null;render()}}
 if(e.key==="Enter"&&e.target.id==="f-msg"){A.send(S.ui.order)}
 if(e.key==="Enter"&&e.target.id==="f-tmsg"){A.sendThread(S.ui.thread||document.querySelector('[data-a="sendThread"]')?.dataset.id)}
 if(e.key==="Enter"&&e.target.id==="f-price"){A.savePrice(S.ui.editPrice)}
});
function toast(html,cls){const t=document.createElement("div");t.className="toast "+(cls||"");t.innerHTML=html;document.getElementById("toasts").appendChild(t);setTimeout(()=>t.remove(),cls==="win"?5200:3400)}
// keep the view name when the page path changes nothing else
S=fresh();
render();
</script>

</body>
</html>
